<!doctype html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1C2127">
  <title>Recep Muhasebe</title>
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: 'Segoe UI', Roboto, 'Noto Sans', Tahoma, Arial, sans-serif; color: #C7CED6; -webkit-font-smoothing: antialiased;
      background: radial-gradient(130% 90% at 50% 0%, #2B333C 0%, #1C2127 55%, #13171C 100%) fixed; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box;
    }
    main { width: 100%; max-width: 420px; }
    img { width: 64px; height: 64px; display: block; }
    h1 { color: #F5F7F9; font-size: 24px; line-height: 1.2; margin: 20px 0 8px; font-weight: 600; }
    p { margin: 0 0 18px; font-size: 15px; line-height: 1.5; color: #AEB7C0; }
    ol { margin: 0 0 24px; padding-inline-start: 22px; font-size: 15px; line-height: 1.5; }
    li { margin-bottom: 8px; }
    button {
      width: 100%; height: 50px; border-radius: 10px; border: 1px solid #9A7524; background: #C59A3D; color: #161B20;
      font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .status { margin-top: 14px; font-size: 13px; color: #8B96A1; text-align: center; min-height: 18px; }
  </style>
</head>
<body>
  <main>
    <img src="/img/icon.svg" alt="">
    <h1 data-t="title">Dükkândaki bilgisayara ulaşılamıyor</h1>
    <p data-t="text">Telefon, Recep Muhasebe'nin çalıştığı bilgisayara bağlanamadı. Şunlara bakın:</p>
    <ol>
      <li data-t="c1">Dükkândaki bilgisayar açık ve Recep Muhasebe çalışıyor mu?</li>
      <li data-t="c2">Telefonda Tailscale açık ve "Connected" (bağlı) görünüyor mu?</li>
      <li data-t="c3">Telefonda internet var mı?</li>
    </ol>
    <button type="button" id="retry" data-t="retry">Tekrar dene</button>
    <div class="status" id="status" aria-live="polite"></div>
  </main>
  <script src="/js/offline.js"></script>
</body>
</html>
