<!doctype html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1C2127">
  <title>Recep Muhasebe</title>
  <style>
    .rm-view-bar {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px; box-sizing: border-box;
      padding: calc(8px + env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));
      background: #1C2127; color: #F5F7F9; font: 15px/1.3 'Segoe UI', Roboto, 'Noto Sans', Tahoma, Arial, sans-serif;
    }
    .rm-view-bar button {
      height: 42px; padding: 0 14px; border-radius: 8px; border: 1px solid #3A434D; background: #252B32; color: #F5F7F9;
      font: inherit; cursor: pointer; white-space: nowrap;
    }
    .rm-view-bar button.primary { background: #C59A3D; border-color: #9A7524; color: #161B20; font-weight: 600; }
    .rm-view-bar .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #C7CED6; }
    .rm-view-page { background: #E6E9E7; min-height: 100vh; padding: 12px 0 calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box; }
    .rm-sheet { background: #fff; margin: 0 auto; padding: 8mm; box-shadow: 0 2px 10px rgba(0, 0, 0, .15); box-sizing: content-box; }
    .rm-view-msg { padding: 40px 20px; text-align: center; font: 16px/1.5 'Segoe UI', Roboto, Arial, sans-serif; color: #48525B; }
    /* the printed page's own rules for the paper (e.g. a receipt 80 mm wide) must not shrink this screen */
    @media screen {
      html, body { width: auto !important; min-width: 0 !important; max-width: none !important; height: auto !important; margin: 0 !important; padding: 0 !important; background: #E6E9E7 !important; }
    }
    @media print {
      .rm-view-bar { display: none !important; }
      .rm-view-page { background: none; min-height: 0; padding: 0; }
      .rm-sheet { zoom: 1 !important; width: auto !important; padding: 0 !important; margin: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="rm-view-bar">
    <button type="button" id="rm-back">&larr;</button>
    <div class="ttl" id="rm-title"></div>
    <button type="button" class="primary" id="rm-print"></button>
  </div>
  <div class="rm-view-page" id="rm-page"></div>
  <script src="js/printview.js"></script>
</body>
</html>
